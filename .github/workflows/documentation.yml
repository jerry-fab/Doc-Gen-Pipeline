# =============================================================================
# GitHub Actions: Automated Code Documentation Pipeline
# =============================================================================
# This workflow invokes our custom Reusable Composite Action (`action.yml`).
#
# How it works:
#   1. In THIS repository: `uses: ./` invokes the root `action.yml` directly.
#   2. In OTHER target repositories: Change `uses: ./` to:
#        `uses: <your-github-username>/Github-Pipeline@main`
# =============================================================================

name: Automated Code Documentation Pipeline

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    name: Execute Code Documentation Action

    steps:
      # Step 1: Checkout repository code with depth 2 for incremental diffs
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Step 2: Invoke our Composite Action!
      # (All python setup, dependency installation, AST parsing, and auto-commit happen inside action.yml)
      - name: Run Documentation Action
        uses: ./
        with:
          output_dir: 'docs'
          commit_message: 'docs: auto-update class architecture documentation [skip ci]'
          api_key: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY }}
